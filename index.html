<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Region Price Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🎮 Steam Price Tracker</h1>
        <p>Введите AppID игры (например, 1091500 для Cyberpunk 2077 или 730 для CS2), чтобы узнать цены по регионам.</p>
        
        <div class="search-box">
            <input type="text" id="appIdInput" placeholder="Введите AppID...">
            <button id="searchBtn">Проверить цены</button>
        </div>

        <div id="result" class="result-container">
            <p class="placeholder-text">Результаты появятся здесь...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
