<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam - Cyber Neon Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Верхняя панель -->
    <div id="global-header">
        <div class="content-wrapper global-header-content">
            <div class="logo">
                <img src="https://store.cloudflare.steamstatic.com/public/shared/images/header/logo_steam.svg?t=962016" alt="Steam Logo">
            </div>
            <nav class="super-nav">
                <a href="#">МАГАЗИН</a>
                <a href="#">СООБЩЕСТВО</a>
                <a href="#">ПОДДЕРЖКА</a>
            </nav>
            <div class="global-actions">
                <button>ВОЙТИ</button>
            </div>
        </div>
    </div>

    <!-- Вторая панель -->
    <header id="store-header">
        <div class="content-wrapper store-nav-content">
            <nav class="store-nav-links">
                <button class="nav-btn plain">Ваш магазин</button>
                <button class="nav-btn plain">Новинки</button>
                <button class="nav-btn plain">Категории</button>
            </nav>
            <div class="store-search-box">
                <input type="text" id="globalSearch" placeholder="поиск игр...">
                <button id="submitSearch">🔍</button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <div class="page-background">
        <div class="content-wrapper main-layout">
            
            <!-- Сайдбар -->
            <aside class="left-sidebar">
                <div class="sidebar-block">
                    <h4>КАТЕГОРИИ</h4>
                    <ul class="sidebar-links">
                        <li><a href="#">Лидеры продаж</a></li>
                        <li><a href="#">Скидки дня</a></li>
                        <li><a href="#">Ранний доступ</a></li>
                    </ul>
                </div>
                <div class="sidebar-block">
                    <h4>ЖАНРЫ</h4>
                    <ul class="sidebar-links">
                        <li><a href="#">Экшен</a></li>
                        <li><a href="#">Киберпанк</a></li>
                        <li><a href="#">Выживание</a></li>
                        <li><a href="#">Стратегии</a></li>
                    </ul>
                </div>
            </aside>

            <!-- Все скидки Steam -->
            <main class="center-content">
                <section>
                    <h2>Все специальные предложения и скидки Steam</h2>
                    <div class="offers-grid" id="specialOffersGrid">
                        <!-- Скрипт заполнит этот блок всеми скидками -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Модальное окно корзины -->
    <div id="cartModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 style="color:var(--neon-orange);">Корзина</h3>
                <button class="close-modal">✖</button>
            </div>
            <div id="cartItemsContainer" style="max-height: 50vh; overflow-y: auto;">
                <p style="color:#777; text-align:center;">Корзина пуста</p>
            </div>
            <div style="border-top: 1px solid #333; margin-top: 15px; padding-top: 15px; display:flex; justify-content:space-between; align-items:center;">
                <span style="color:#fff; font-weight:bold;">Итого: <span id="cartTotalPrice" style="color:var(--neon-yellow);">0.00 UZ</span></span>
                <button style="background:var(--neon-orange); border:none; padding:8px 16px; font-weight:bold; cursor:pointer; border-radius:3px;">Оплатить</button>
            </div>
        </div>
    </div>

    <!-- Кнопка корзины -->
    <div id="floatingCartBtn">
        🛒 <span id="floatingCartCount">0</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
