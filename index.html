<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Sale Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Шапка -->
        <header class="app-header">
            <div class="logo-area">
                <div class="logo-icon">🎮</div>
                <div>
                    <h1>Steam Sale Tracker</h1>
                    <p>Радар скидок и цен</p>
                </div>
            </div>
        </header>

        <!-- Основная область с экранами (вкладками) -->
        <main class="content-area">
            
            <!-- Экран 1: Главная -->
            <section id="tab-home" class="tab-pane active">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Поиск игры по названию или ID...">
                    <button id="searchBtn">🔍</button>
                </div>
                <h2>Популярные скидки</h2>
                <div id="gamesContainer" class="games-grid">
                    <p class="status-text">Загрузка данных...</p>
                </div>
            </section>

            <!-- Экран 2: Избранное -->
            <section id="tab-favorites" class="tab-pane">
                <h2>Избранное</h2>
                <p class="status-text">Здесь пока пусто. Добавляйте игры в избранное из поиска!</p>
                <div id="favoritesContainer" class="games-grid"></div>
            </section>

            <!-- Экран 3: Уведомления -->
            <section id="tab-notifications" class="tab-pane">
                <h2>Уведомления</h2>
                <div class="card-box">
                    <p><strong>Фоновый мониторинг:</strong> Активен</p>
                    <p class="card-desc">Мы сообщим, когда цены на избранные игры снизятся.</p>
                </div>
            </section>

            <!-- Экран 4: Настройки -->
            <section id="tab-settings" class="tab-pane">
                <h2>Настройки</h2>
                <div class="card-box">
                    <label for="regionSelect">Регион Steam по умолчанию:</label>
                    <select id="regionSelect">
                        <option value="uz">Узбекистан (UZ)</option>
                        <option value="us">США (US)</option>
                        <option value="kz">Казахстан (KZ)</option>
                        <option value="tr">Турция (TR)</option>
                        <option value="ru">Россия (RU)</option>
                    </select>
                </div>
            </section>

        </main>

        <!-- Нижняя навигация (как в приложении погоды) -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-target="tab-home">
                <span class="nav-icon">🏠</span>
                <span>Главная</span>
            </button>
            <button class="nav-btn" data-target="tab-favorites">
                <span class="nav-icon">❤️</span>
                <span>Избранное</span>
            </button>
            <button class="nav-btn" data-target="tab-notifications">
                <span class="nav-icon">🔔</span>
                <span>Уведомления</span>
            </button>
            <button class="nav-btn" data-target="tab-settings">
                <span class="nav-icon">⚙️</span>
                <span>Настройки</span>
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
